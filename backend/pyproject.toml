[project]
name = "blindcreators-api"
version = "3.0.0"
description = "BlindCreators backend: YouTube channel sync, Shorts retention analytics and AI insights"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "tenacity>=9.0",
    "pyjwt>=2.10",
    "google-genai>=1.0",
    "chromadb>=1.0",
    "youtube-transcript-api>=1.0",
    "pillow>=11.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "respx>=0.22", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
